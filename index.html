<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>巷口咖啡日誌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1E7D3;--card:#FFF9EE;--ink:#2B2622;--mute:#85796C;--line:#E2D5BE;--coffee:#7A5236;--gold:#E0A43A;--matcha:#5E8A45;--red:#C4553D;--blue:#4E78A6;--pink:#D9475A}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",system-ui,sans-serif;font-size:15px}
body{background-image:radial-gradient(#e6d8bd 1px,transparent 1px);background-size:8px 8px}
.app{max-width:480px;margin:0 auto;padding:12px 12px 96px}
.px{font-family:"DotGothic16","Noto Sans TC",monospace}
.card{background:var(--card);border:2px solid var(--ink);border-radius:6px;padding:12px;margin-bottom:12px;box-shadow:3px 3px 0 var(--ink)}
.kicker{font-size:12px;letter-spacing:.08em;color:var(--mute);font-weight:700}
.row{display:flex;align-items:center;gap:6px}
.between{justify-content:space-between}
h1.day{font-size:30px;margin:2px 0 0;font-weight:400;line-height:1.1}
.sub{color:var(--mute);font-size:13px}
.clock{font-size:26px;letter-spacing:.04em}
.btn{border:2px solid var(--ink);background:var(--card);color:var(--ink);border-radius:4px;padding:6px 12px;font:inherit;font-weight:700;font-size:14px;cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:none}
.btn.dark{background:var(--ink);color:#FFF9EE}
.btn.gold{background:var(--gold)}
.btn.pink{background:#F7D9DE}
.btn.big{width:100%;padding:13px;font-size:17px}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.sm{padding:3px 8px;font-size:13px}
.ico{border:0;background:none;font-size:18px;cursor:pointer;padding:2px 4px;opacity:.9}
.ico.off{opacity:.3}
.track{position:relative;height:8px;background:var(--line);border:2px solid var(--ink);margin:12px 0 4px}
.fill{position:absolute;left:0;top:0;bottom:0;background:var(--gold)}
.marks{position:relative;height:16px;font-size:11px;color:var(--mute)}
.marks span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.scene{position:relative;border:2px solid var(--ink);margin-top:10px;background:#000;line-height:0;overflow:hidden}
canvas.sc{width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;display:block;cursor:pointer;touch-action:manipulation}
.float{position:absolute;font-size:12px;font-weight:700;pointer-events:none;animation:up 1.3s ease-out forwards;white-space:nowrap;background:#FFF9EE;border:1.5px solid var(--ink);padding:0 5px;line-height:1.5;transform:translateX(-50%);z-index:3}
@keyframes up{from{opacity:1;margin-top:0}to{opacity:0;margin-top:-30px}}
.say{position:absolute;transform:translate(-50%,-100%);background:#fff;border:1.5px solid var(--ink);border-radius:4px;padding:2px 6px;font-size:11px;line-height:1.45;max-width:46%;width:max-content;pointer-events:none;z-index:4;animation:pop .15s}
.say b{color:var(--coffee)}
.say:after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-4px;border:4px solid transparent;border-top-color:var(--ink)}
.say.reg{background:#FFF2F4;border-color:var(--pink)}
.say.reg:after{border-top-color:var(--pink)}
@keyframes pop{from{transform:translate(-50%,-90%) scale(.8);opacity:0}}
.lbl{position:absolute;font-size:9px;line-height:1;background:var(--ink);color:#FFF9EE;padding:2px 4px;transform:translate(-50%,0);pointer-events:none;font-family:"DotGothic16",monospace;z-index:2}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:10px}
.stat{background:var(--bg);border:1.5px solid var(--line);border-radius:4px;padding:5px 2px;text-align:center}
.stat b{display:block;font-size:17px;font-weight:400}
.stat small{color:var(--mute);font-size:11px}
.inv{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.chip{position:relative;background:var(--bg);border:1.5px solid var(--line);border-radius:4px;padding:5px 0 4px;text-align:center;font-size:11px;color:var(--mute)}
.chip .q{display:block;font-size:15px;color:var(--ink)}
.chip .ic{font-size:16px;display:block;line-height:1.2}
.badge{position:absolute;top:-6px;right:-4px;background:var(--gold);color:#2B2622;font-size:10px;font-weight:700;border:1.5px solid var(--ink);padding:0 3px;line-height:1.3}
.badge.r{background:var(--red);color:#fff}
.chip.locked{opacity:.35}
.feed{font-size:13px;color:var(--mute);line-height:1.7;min-height:80px}
.feed div:first-child{color:var(--ink)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid var(--ink);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav .in{display:flex;max-width:480px;width:100%}
nav button{flex:1;border:0;background:none;padding:8px 0 10px;font:inherit;font-size:11.5px;color:var(--mute);cursor:pointer;position:relative}
nav button .i{display:block;font-size:19px;margin-bottom:1px}
nav button.on{color:var(--ink);font-weight:700;background:var(--bg)}
nav .dot{position:absolute;top:6px;right:22%;width:8px;height:8px;background:var(--pink);border:1.5px solid var(--ink)}
.line{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1.5px dashed var(--line)}
.line:last-child{border-bottom:0}
.grow{flex:1;min-width:0}
.name{font-weight:700}
.meta{font-size:12px;color:var(--mute);margin-top:2px;line-height:1.5}
.step{display:flex;align-items:center;border:2px solid var(--ink);border-radius:4px;overflow:hidden;background:var(--card)}
.step button{border:0;background:none;width:30px;height:28px;font-size:17px;cursor:pointer;color:var(--ink)}
.step span{min-width:46px;text-align:center;font-variant-numeric:tabular-nums;font-weight:700}
.bar{height:6px;background:var(--line);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%}
.tag{display:inline-block;font-size:11px;padding:0 6px;border-radius:3px;background:var(--bg);color:var(--mute);margin-left:4px;font-weight:500}
.tag.g{background:#E1ECD5;color:var(--matcha)}.tag.r{background:#F6E1DA;color:var(--red)}.tag.y{background:#F6E8C8;color:#87601A}.tag.p{background:#F7D9DE;color:var(--pink)}
.seg{display:flex;border:2px solid var(--ink);border-radius:4px;margin-bottom:8px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--card);padding:7px;font:inherit;font-size:14px;color:var(--mute);cursor:pointer}
.seg button+button{border-left:2px solid var(--ink)}
.seg button.on{background:var(--ink);color:#FFF9EE;font-weight:700}
.modal{position:fixed;inset:0;background:rgba(43,38,34,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20;animation:fade .2s}
.modal .sheet{background:var(--card);width:100%;max-width:480px;border:2px solid var(--ink);border-bottom:0;border-radius:8px 8px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
@keyframes fade{from{opacity:0}}
table{width:100%;border-collapse:collapse;font-size:14px}
td{padding:5px 0;border-bottom:1px dashed var(--line)}
td:last-child{text-align:right;font-variant-numeric:tabular-nums}
tr.total td{border-bottom:0;font-weight:700;font-size:16px;padding-top:8px}
.neg{color:var(--red)}.pos{color:var(--matcha)}
.tip{background:var(--bg);border-left:4px solid var(--gold);padding:8px 10px;font-size:13px;margin-top:8px;line-height:1.6}
.tip.warn{border-color:var(--red)}.tip.love{border-color:var(--pink);background:#FFF2F4}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--ink);color:#FFF9EE;padding:9px 14px;border-radius:4px;font-size:14px;z-index:30;animation:fade .2s;max-width:90%}
.stars{color:var(--gold);letter-spacing:1px}
.hint{font-size:12px;color:var(--mute);line-height:1.6}
.quest{display:flex;align-items:center;gap:8px;background:#FFF2D6;border:2px dashed var(--gold);border-radius:4px;padding:8px 10px;margin-top:10px;font-size:13px}
input.nm{border:2px solid var(--ink);border-radius:4px;padding:9px;font:inherit;width:100%;background:var(--bg)}
canvas.por{width:72px;height:72px;image-rendering:pixelated;border:2px solid var(--ink);border-radius:4px;flex:none;background:#f6e8c8}
canvas.por.sm{width:56px;height:56px}
.hearts{color:var(--pink);letter-spacing:1px;font-size:13px}
.vn{position:fixed;inset:0;z-index:25;display:flex;align-items:flex-end;justify-content:center;background:rgba(43,38,34,.55);animation:fade .2s}
.vn .box{width:100%;max-width:480px;margin:0 10px calc(16px + env(safe-area-inset-bottom));background:var(--card);border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);border-radius:6px;padding:14px;display:flex;gap:12px;cursor:pointer;min-height:150px}
.vn .who{font-weight:700;color:var(--coffee);margin-bottom:4px}
.vn .txt{font-size:16px;line-height:1.7;min-height:56px}
.vn .nx{font-size:12px;color:var(--mute);text-align:right;margin-top:6px;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.3}}
.rev{border-bottom:1px dashed var(--line);padding:7px 0;font-size:13px;line-height:1.55}
.rev:last-child{border-bottom:0}
.cal{display:inline-block;font-size:11px;background:var(--ink);color:#FFF9EE;padding:0 6px;border-radius:3px;margin-left:4px;font-weight:700;vertical-align:1px}
.cal.fest{background:var(--red)}
.art{display:flex;flex-direction:column;align-items:center;gap:10px;margin:8px 0}
.art canvas{image-rendering:pixelated;border:2px solid var(--ink);border-radius:4px;background:#f6e8c8}
.medal{font-size:46px;text-align:center;line-height:1.2}
.grade{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
h3.sec{font-size:13px;margin:14px 0 0;color:var(--coffee);border-bottom:2px solid var(--ink);padding-bottom:3px}
.chap{background:linear-gradient(135deg,#FFF2D6,#FFF9EE);}

/* ===== v9 ===== */
.mini{display:flex;gap:4px;margin:3px 0 4px;flex-wrap:wrap}
.mini button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:3px 9px;font:inherit;font-size:12px;color:var(--mute);cursor:pointer}
.mini button.on{background:var(--coffee);border-color:var(--coffee);color:#fff;font-weight:700}
.sch,.schhead{display:flex;align-items:center;gap:8px;margin:4px 0}
.schn{width:44px;font-size:12px;font-weight:700;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.schhead span{width:44px;flex:none}
.scht{position:relative;flex:1;height:20px;background:repeating-linear-gradient(90deg,#F3EADC 0 10%,#FBF6EE 10% 20%);border-radius:7px}
.scht i{position:absolute;top:2px;bottom:2px;border-radius:6px;color:#fff;font-size:11px;font-style:normal;display:flex;align-items:center;justify-content:center;font-weight:700}
.schax{flex:1;display:flex;justify-content:space-between;font-size:10px;color:var(--mute)}.schax b{font-weight:400}
/* ===== v8 ===== */
nav .in{padding:4px 6px 2px}
nav button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0 8px;border-radius:14px;margin:0 2px}
nav button .i{display:flex;align-items:center;justify-content:center;width:40px;height:32px;border-radius:12px;margin:0;transition:transform .15s,background .15s}
nav button .i img{width:28px;height:28px}
nav button:not(.on) .i img{filter:saturate(.55) opacity(.75)}
nav button.on .i{background:#F6E6CF;transform:translateY(-2px)}
nav button.on::before{display:none}
nav button .nl{font-size:11px}
nav button.on .nl{color:var(--coffee);font-weight:700}
nav .dot{top:4px;right:calc(50% - 22px)}
/* ===== v7 ===== */
img.pix{image-rendering:pixelated;image-rendering:crisp-edges;vertical-align:middle}
.icbox{width:40px;height:40px;flex:none;border-radius:12px;background:#F6EEE2;display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:inset 0 0 0 1px #EBDFCD}
.icbox.duo{width:52px;gap:0}.icbox.duo img{margin:0 -3px}
.chip .ic{height:26px;display:flex;align-items:center;justify-content:center}
.shopcard{padding:12px}
.spd{display:flex;background:#F1E8DB;border-radius:12px;padding:3px;margin-top:10px;gap:2px}
.spd button{flex:1;border:0;background:none;border-radius:9px;padding:6px 0;font:inherit;font-size:13px;font-weight:700;color:var(--mute);cursor:pointer;font-family:"DotGothic16","Noto Sans TC",monospace}
.spd button.on{background:var(--coffee);color:#fff;box-shadow:0 1px 4px rgba(58,46,38,.25)}
.live{color:var(--matcha)}.live::before{content:"●";margin-right:3px;animation:blink 1.4s infinite;font-size:10px;vertical-align:1px}
@keyframes blink{50%{opacity:.25}}
.hud{position:absolute;z-index:3;display:flex;align-items:center;gap:5px;background:rgba(43,32,26,.72);color:#fff;border-radius:10px;padding:3px 8px;font-size:15px;line-height:1.2;backdrop-filter:blur(4px)}
.hud.hl{left:6px;top:6px}.hud b{font-weight:400;font-size:16px;letter-spacing:.03em}
.rushb{animation:blink .6s infinite}
.hudbar{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(0,0,0,.18);z-index:3}.hudbar i{display:block;height:100%;background:linear-gradient(90deg,#E2A93B,#D9566B)}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.act{border:1px solid var(--line);background:linear-gradient(#fff,#FBF5EC);border-radius:14px;padding:7px 4px 6px;font:inherit;font-size:13px;font-weight:700;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;box-shadow:0 2px 0 #EADBC6;transition:transform .08s}
.act span{font-size:22px;line-height:1.1}.act small{font-size:10.5px;color:var(--mute);font-weight:500}
.act:active{transform:translateY(2px);box-shadow:none}.act:disabled{opacity:.42}
.act.on{background:linear-gradient(#FFE6C8,#FFD3A0);border-color:#F2B36A;animation:pulse 1s infinite}
.act.glow{border-color:var(--gold);box-shadow:0 0 0 3px rgba(226,169,59,.25),0 2px 0 #EADBC6}
@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(242,140,60,.25)}}
.sta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute);margin-top:8px}.sta .bar{height:7px;border-radius:7px;margin:0}.sta .bar i{border-radius:7px}.sta b{color:var(--ink);font-weight:400;min-width:24px;text-align:right}
.evcard{display:flex;gap:10px;margin-top:10px;padding:10px 12px;border-radius:16px;background:linear-gradient(135deg,#FFF6E4,#FFEFD8);border:1px solid #F1D3A4;box-shadow:0 4px 14px rgba(226,169,59,.18);animation:evin .25s ease-out}
@keyframes evin{from{transform:translateY(-6px) scale(.98);opacity:0}}
.evic{font-size:30px;line-height:1}
.evbar{height:4px;border-radius:4px;background:rgba(0,0,0,.08);margin-top:8px;overflow:hidden}.evbar i{display:block;height:100%;background:var(--gold);animation:evt linear forwards;width:100%}
@keyframes evt{to{width:0}}
.hrt{position:absolute;z-index:5;transform:translate(-50%,-50%);border:2px solid #fff;background:radial-gradient(circle at 35% 30%,#ff9ab0,#e04a6a);color:#fff;width:24px;height:24px;border-radius:50%;font-size:12px;cursor:pointer;box-shadow:0 3px 10px rgba(224,74,106,.45);animation:hb .9s ease-in-out infinite;padding:0;line-height:1}
@keyframes hb{50%{transform:translate(-50%,-62%) scale(1.08)}}
.stat{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.stat small{white-space:nowrap}.stat.bad b{color:var(--red)}
canvas.catpor{background:#f6e8c8}
/* ===== v6 介面 ===== */
:root{--bg:#F6F0E7;--card:#FFFDF9;--ink:#3A2E26;--mute:#9A8B7D;--line:#EBE1D3;--coffee:#6F4A33;--gold:#E2A93B;--matcha:#6A9150;--red:#C9573F;--blue:#4F7CA8;--pink:#D9566B;--sh:0 1px 2px rgba(58,46,38,.05),0 6px 18px rgba(58,46,38,.07)}
html,body{background:var(--bg)}
body{background-image:radial-gradient(1200px 400px at 50% -200px,#FBE9D2 0,transparent 70%)}
.app{padding:8px 12px 100px}
.card{border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh);padding:14px}
.kicker{color:var(--coffee);opacity:.75;letter-spacing:.06em}
.btn{border:1px solid var(--line);background:#fff;border-radius:11px;box-shadow:0 1px 0 rgba(58,46,38,.06);transition:transform .08s}
.btn:active{transform:scale(.96);box-shadow:none}
.btn.dark{background:var(--coffee);border-color:var(--coffee);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#3A2E26}
.btn.pink{background:#FCE7EB;border-color:#F4C9D1;color:var(--pink)}
.btn.big{border-radius:14px}
.btn:disabled{opacity:.4}
.link{border:0;background:#F3EADC;color:var(--coffee);border-radius:8px;padding:1px 7px;font:inherit;font-size:11px;font-weight:700;cursor:pointer}
.ico{background:#F3EADC;border-radius:10px;padding:3px 6px;margin-left:4px}
.scene{border:0;border-radius:14px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06),0 4px 14px rgba(58,46,38,.12)}
.track{height:6px;border:0;border-radius:6px;background:var(--line)}
.fill{border-radius:6px;background:linear-gradient(90deg,#E2A93B,#D9566B)}
.stat{background:var(--bg);border:0;border-radius:12px;padding:7px 2px}
.stat b{color:var(--ink)}
.chip{background:var(--bg);border:0;border-radius:12px}
.badge{border:2px solid var(--card);border-radius:8px}
.inv{grid-template-columns:repeat(5,1fr)}
.quest{border-width:1px;border-radius:14px}
.tip{border-left:3px solid var(--gold);border-radius:0 12px 12px 0;background:#FBF5EC}
.tip.love{background:#FDF0F2}
.line{border-bottom:1px solid var(--line)}
.step{border:1px solid var(--line);border-radius:11px;background:#fff}
.seg{border:0;background:#F1E8DB;border-radius:13px;padding:3px}
.seg button{border-radius:10px}
.seg button+button{border-left:0}
.seg button.on{background:var(--card);color:var(--coffee);box-shadow:0 1px 4px rgba(58,46,38,.15)}
h3.sec{border-bottom:0;color:var(--mute);font-size:12px;letter-spacing:.06em;margin:16px 0 6px}
nav{background:rgba(255,253,249,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line)}
nav button{position:relative;transition:color .15s}
nav button.on{background:none;color:var(--coffee)}
nav button.on::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--coffee)}
nav button .i{transition:transform .15s}nav button.on .i{transform:translateY(-1px) scale(1.08)}
.modal .sheet{border:0;border-radius:22px 22px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.18);padding-top:22px;position:relative}
.modal .sheet::before{content:"";position:absolute;top:8px;left:50%;width:38px;height:4px;margin-left:-19px;border-radius:4px;background:var(--line)}
.vn .box{border:0;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
canvas.por{border:2px solid var(--line);border-radius:12px}
.toast{border-radius:12px;box-shadow:0 6px 18px rgba(0,0,0,.2)}
.say{border-radius:8px}
.topbar{position:sticky;top:0;z-index:8;background:rgba(246,240,231,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.tbin{max-width:480px;margin:0 auto;padding:8px 14px;display:flex;align-items:center;gap:10px;font-size:13px}
.tbd{display:flex;align-items:center;gap:5px;flex:1;min-width:0}.tbd b{font-size:14px}.tbd small{color:var(--mute)}
.tbc{background:var(--coffee);color:#fff;border-radius:8px;padding:1px 8px;font-size:13px}
.tbm b,.tbr b{margin-left:2px;font-weight:400}
.ingg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ingb{border:1px solid var(--line);background:#fff;border-radius:12px;padding:6px 2px 5px;font:inherit;font-size:11.5px;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.25}
.ingb span{font-size:20px}
.ingb.sel{background:#FFF1D6;border-color:var(--gold);box-shadow:0 0 0 2px rgba(226,169,59,.35)}
.ingb:disabled{opacity:.35}
.mix{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;min-height:52px;margin:10px 0;padding:10px;border-radius:14px;background:repeating-linear-gradient(45deg,#FBF3E6 0 8px,#F7ECDC 8px 16px);border:1px dashed #E5D3B8;font-weight:700}

const R=Math.random, clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rr=(a,b)=>a+R()*(b-a);

const f2=v=>'$'+v.toFixed(2);
const hm=m=>{m=Math.floor(m);return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
function gauss(x,mu,s){return Math.exp(-((x-mu)**2)/(2*s*s))}
function poisson(l){let L=Math.exp(-l),k=0,p=1;do{k++;p*=R()}while(p>L);return k-1}
function wpick(arr){let s=arr.reduce((a,b)=>a+b[1],0),r=R()*s;for(const [k,w] of arr){if((r-=w)<=0)return k}return arr[0][0]}
const pickA=a=>a[Math.floor(R()*a.length)];

function audioInit(){
 if(typeof window==='undefined'||!(window.AudioContext||window.webkitAudioContext))return;
 if(!AU.ctx){const c=AU.ctx=new (window.AudioContext||window.webkitAudioContext)();
  const master=c.createGain();master.gain.value=.7;master.connect(c.destination);
  AU.sG=c.createGain();AU.sG.gain.value=.55;AU.sG.connect(master);
  const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2400;lp.connect(master);
  AU.mG=c.createGain();AU.mG.gain.value=AU.m?.32:0;AU.mG.connect(lp);
  const b=c.createBuffer(1,c.sampleRate,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=R()*2-1;AU.nb=b;
  AU.next=c.currentTime+.1;AU.timer=setInterval(sched,50);}

}
function env(g,t,a,d,v){g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+a+d)}
function osc(type,f,t,a,d,v,dest,f2){const c=AU.ctx,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+a+d);env(g,t,a,d,v);o.connect(g);g.connect(dest);o.start(t);o.stop(t+a+d+.05)}
function nz(t,d,v,type,freq,dest,q=1){const c=AU.ctx,s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=AU.nb;f.type=type;f.frequency.value=freq;f.Q.value=q;env(g,t,.005,d,v);s.connect(f);f.connect(g);g.connect(dest);s.start(t,R()*.5);s.stop(t+d+.05)}
const mtof=n=>440*Math.pow(2,(n-69)/12);
function sfx(k,force){
 if(!AU.ctx||!AU.s)return;const now=performance.now(),gap={bell:350,cash:160,steam:2500,sad:500,blip:45,clink:300,spark:200}[k]||80;
 if(!force&&now-(AU.last[k]||0)<gap*(S&&S.speed>2?2:1))return;AU.last[k]=now;
 const t=AU.ctx.currentTime+.01,D=AU.sG;
 switch(k){
  case'bell':osc('sine',1568,t,.005,.5,.18,D);osc('sine',2093,t+.13,.005,.7,.15,D);break;
  case'cash':nz(t,.04,.25,'highpass',3000,D);osc('square',2637,t+.03,.003,.08,.06,D);osc('sine',3520,t+.09,.003,.35,.12,D);break;
  case'steam':nz(t,.7,.06,'bandpass',4200,D,.8);break;
  case'clink':osc('sine',3800,t,.002,.12,.08,D);osc('sine',5200,t+.02,.002,.1,.05,D);break;
  case'sad':osc('triangle',392,t,.01,.3,.1,D,262);break;
  case'spark':[1568,2093,2637,3136].forEach((f,i)=>osc('sine',f,t+i*.05,.003,.18,.08,D));break;
  case'click':osc('square',880,t,.002,.04,.04,D);break;
  case'blip':osc('square',660+R()*120,t,.002,.03,.025,D);break;
  case'meow':osc('triangle',700,t,.03,.35,.12,D,450);osc('sine',1400,t,.03,.3,.04,D,900);break;
  case'love':[1047,1319,1568].forEach((f,i)=>osc('triangle',f,t+i*.07,.005,.25,.08,D));break;
  case'level':[523,659,784,1047,1319].forEach((f,i)=>osc('square',f,t+i*.09,.005,.22,.05,D));osc('triangle',1047,t+.45,.01,.8,.08,D);break;
  case'open':[784,988,1175,1568].forEach((f,i)=>osc('triangle',f,t+i*.08,.005,.3,.08,D));break;
  case'close':[1175,988,784,587].forEach((f,i)=>osc('triangle',f,t+i*.12,.005,.4,.08,D));break;
 }
}
/* Lo-fi 背景音樂：Fmaj7 – Em7 – Dm7 – Cmaj7 */
const PROG=[[53,57,60,64,67],[52,55,59,62,67],[50,53,57,60,64],[48,52,55,59,62]];
const PENTA=[72,74,76,79,81,84];
function sched(){
 if(!AU.ctx)return;const c=AU.ctx,stepDur=60/74/4;
 while(AU.next<c.currentTime+.25){const st=AU.step%16,t=AU.next+(st%2?stepDur*.18:0);
  if(AU.m){const ch=PROG[AU.bar%4],G=AU.mG;
   if(st===0||st===10)ch.slice(0,4).forEach((n,i)=>{osc('sine',mtof(n),t+i*.012,.03,st?1.0:1.8,.06,G);osc('triangle',mtof(n)*1.003,t+i*.012,.03,st?.8:1.4,.02,G)});
   if(st===0||st===7||st===8)osc('triangle',mtof(ch[0]-12),t,.01,.45,.16,G);
   if(st===0||st===9)osc('sine',110,t,.002,.22,.35,G,42);
   if(st===4||st===12)nz(t,.12,.07,'bandpass',1800,G,.7);
   if(st%2===0)nz(t,.03,.025,'highpass',7000,G);
   if(R()<.13&&st%2===0)osc('triangle',mtof(pickA(PENTA)),t,.02,.7,.035,G);
  }
  AU.next+=stepDur;AU.step++;if(AU.step%16===0)AU.bar++;}
}
function rainAmb(on){
 if(!AU.ctx)return;
 if(on&&!AU.rain&&AU.s){const c=AU.ctx,s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=AU.nb;s.loop=true;f.type='lowpass';f.frequency.value=1100;g.gain.value=.06;s.connect(f);f.connect(g);g.connect(AU.sG);s.start();AU.rain={s,g}}
 if((!on||!AU.s)&&AU.rain){try{AU.rain.s.stop()}catch(e){}AU.rain=null}
}
function toggleAudio(k){audioInit();AU[k]=!AU[k];if(k==='m'&&AU.mG)AU.mG.gain.value=AU.m?.32:0;

function modMult(kind){return S.mods.filter(m=>m.kind===kind).reduce((a,m)=>a*m.mult,1)}
function segMult(seg){
 if(seg==='office')return (perk('azhe',4)?1.12:1)*(lv('window')?1.1:1);
 if(seg==='student')return (perk('xiaoyu',2)?1.1:1)*(lv('wifi')?1.15:1);

 if(seg==='tourist')return (perk('mika',4)?1.15:1)*(perk('leo',2)?1.1:1)*(catOwn('mikan')?1.05+catH('mikan')*.01:1);return 1}
function segPk(seg){return SEG[seg].pk+(seg==='student'&&perk('xiaoyu',4)?.08:0)}
function trafficMult(){
 const w=WEATHER[S.weather];let wt=w.t;if(lv('aircon')&&(S.weather==='hot'||S.weather==='cold'))wt=1-(1-wt)/2;if(lv('awning')&&S.weather==='rainy')wt=1-(1-wt)/2;
 let m=wt*WDF[(S.day-1)%7]*(1+[0,.12,.25][lv('sign')])*(lv('expand')?1.35:1)*(0.5+S.rep/100)*modMult('traffic')*(perk('leo',4)?1.08:1)*brandMult()*(Object.keys(S.hype||{}).length?1.06:1)*(S.today&&S.today.boostUntil>S.t?1.2:1)*(cfOwn('hammock')?1.04:1)*(1+.05*guideCups())*(1+.02*(S.sig||[]).length);
 if(lv('outdoor'))m*=(S.weather==='sunny'||S.weather==='hot')?1.15:1.05;return m}
function curve(m){const we=isWeekend();return 0.22+(we?0.6:1)*gauss(m,525,45)+1.1*gauss(m,750,55)+(we?0.9:0.55)*modMult('afternoon')*gauss(m,930,70)}
const arrRate=m=>0.3*curve(m)*trafficMult();
const willK=()=>[0,.03,.06][lv('cups')]+(cfOwn('tree')?.02:0)+0.75+S.rep/200+[0,.06,.12][lv('decor')]+(perk('mika',2)?.04:0)+.03*Math.min(2,tcount('art'))+quality()+themeBonus()+.02*sk('art');
function accept(k,p,pk=1){const x=p/(MENU[k].ref*willK()*pk*(1+.03*star(k)));return clamp((1.45-x)/0.6,0,1)}
const mktPrice=k=>(1-.04*sk('deal'))*(lv('storage')?.95:1)*(S.prices[k]||ING[k].base)*(k==='beans'?GRADES[S.beanGrade||0].m:1)*((k==='beans'||k==='milk')&&tcount('thrifty')?.94:1);

function itemCost(k){let c=0;for(const i in MENU[k].need)c+=unitCost(i)*MENU[k].need[i];return c}
function bestPrice(k){const c=itemCost(k);let bp=c,bv=-1;for(let p=Math.max(1,c);p<=MENU[k].ref*2.2;p+=0.1){const v=accept(k,p)*(p-c);if(v>bv){bv=v;bp=p}}return Math.round(bp*10)/10}
function choiceWeights(seg){const c=WEATHER[S.weather].c,pf=seg?SEG[seg].pref:{};
 return Object.keys(MENU).filter(unlocked).map(k=>[k,MENU[k].w*(MENU[k].cold?c*(lv('icemaker')?1.1:1):1)*(MENU[k].warm?clamp(1.6-c*.6,.2,1.6):1)*(pf[k]||1)*(S.hype&&S.hype[k]?1.8:1)*(isSig(k)?1.5:1)])}
const stock=k=>S.inv[k].reduce((a,l)=>a+l.q,0);
function hasStock(item){for(const i in MENU[item].need)if(stock(i)<MENU[item].need[i])return false;return true}
function shelfOf(k){return (k==='ice'&&lv('icemaker')?1:0)+(lv('storage')&&ING[k].shelf>1?1:0)+ING[k].shelf+(ING[k].fridge&&lv('fridge')?3:0)+(k==='croissant'&&lv('oven')?1:0)+(k==='croissant'&&perk('wang',4)?1:0)}
function addLot(k,q,c,g){S.inv[k].push({q,c:c??unitCost(k),exp:S.day+shelfOf(k)-1,g:k==='beans'?(g??S.beanGrade??0):undefined});S.inv[k].sort((a,b)=>a.exp-b.exp)}
function consume(k,n){const L=S.inv[k];while(n>0&&L.length){const t=Math.min(n,L[0].q);L[0].q-=t;n-=t;if(L[0].q<=0)L.shift()}}
const expiringTonight=k=>S.inv[k].filter(l=>l.exp<=S.day).reduce((a,l)=>a+l.q,0);
const segWeights=m=>Object.keys(SEG).map(k=>[k,SEG[k].wt(m)*segMult(k)]);
function estimate(){
 let cust=0;for(let m=480;m<1080;m+=2)cust+=arrRate(m)*2;
 const cap=capacity()*10,items={};let buyers=0;
 const sw=segWeights(750),st=sw.reduce((a,b)=>a+b[1],0);
 for(const [sg,sv] of sw){const W=choiceWeights(sg),tot=W.reduce((a,b)=>a+b[1],0);
  for(const [k,w] of W){const n=cust*(sv/st)*w/tot*accept(k,S.price[k],segPk(sg));items[k]=(items[k]||0)+n;buyers+=n}}
 if(lv('delivery')){const d=cust*0.2*0.6;buyers+=d;items.latte=(items.latte||0)+d*.5;items.americano=(items.americano||0)+d*.5}
 let work=0;for(const k in items)work+=items[k]*(MENU[k].work||1)*(MENU[k].food?0:1);
 const scale=work>cap*0.92?cap*0.92/work:1;
 for(const k in items)items[k]*=scale;
 const drinks=Object.keys(items).filter(k=>!MENU[k].food).reduce((a,k)=>a+items[k],0);
 const foods=Object.keys(MENU).filter(k=>MENU[k].food&&unlocked(k)),fw=foods.map(k=>(MENU[k].w||.3)*(MENU[k].am?1.1:1)),fwt=fw.reduce((a,b)=>a+b,0)||1;
 foods.forEach((k,i)=>{items[k]=(items[k]||0)+drinks*(0.3+(lv('oven')?.1:0))*fw[i]/fwt*accept(k,S.price[k])});
 const ing={};for(const k in ING)ing[k]=0;
 for(const k in items)for(const i in MENU[k].need)ing[i]+=items[k]*MENU[k].need[i];
 return {cust,items,ing,cap};
}

function questProg(){const q=S.quest,T=S.today;if(!q)return [0,1];
 if(q.k==='sold')return [T.sold[q.item]||0,q.n];if(q.k==='dine')return [T.dine,q.n];
 if(q.k==='rev')return [Math.floor(T.rev),q.n];if(q.k==='talk')return [T.talks||0,q.n];
 if(q.k==='nostock')return [T.lostStock,q.n,'max'];if(q.k==='nowait')return [T.lostWait,q.n,'max'];return [0,1]}
function questOK(){const [c,n,mx]=questProg();return mx?c<=n:c>=n}

const SPD=26;
function moveAll(dm,quiet){
 catsTick(dm);
 // 櫃檯點餐：隊首走到櫃檯才開始點
 const f=LINE[0];
 if(f&&S.phase==='open'&&PICK.length<10&&!(S.today.blackout&&S.t>=840&&S.t<900)&&Math.hypot(f.x-REG.x,f.y-REG.y)<1.5){
  S.regT+=dm*cashierSpeed();f.ordering=true;if(S.regT>=0.5){S.regT=0;LINE.shift();f.ordering=false;decide(f,quiet)}}
 for(let i=ENT.length-1;i>=0;i--){const e=ENT[i];
  if(e.icT>0)e.icT-=dm;
  let tg=e.wp[0];
  if(!tg&&e.st==='line'){const qi=LINE.indexOf(e);tg=lineSlot(qi<0?0:qi)}
  if(!tg&&e.st==='pick'){const pi=PICK.indexOf(e);tg=pickSlot(pi<0?0:pi);
   if(e.ready&&Math.hypot(e.x-tg.x,e.y-tg.y)<1.5){depart(e,quiet);continue}}
  if(tg){const dx=tg.x-e.x,dy=tg.y-e.y,d=Math.hypot(dx,dy),st=SPD*dm;
   if(d<=st){e.x=tg.x;e.y=tg.y;if(e.wp.length)e.wp.shift();if(!e.wp.length)arriveAt(e,i)}
   else{e.x+=dx/d*st;e.y+=dy/d*st;e.f+=dm*7;if(Math.abs(dx)>0.3)e.dir=dx>0?1:-1}}
  else if(e.st==='line'||e.st==='pick')e.dir=1;
 }
 CLEANERS.forEach((c,ci)=>{const d=SEATS.find(s=>s.dirty&&!CLEANERS.some((o,oi)=>oi!==ci&&o.tg===s.tx+','+s.ty));c.tg=d?d.tx+','+d.ty:null;
  const tg=d?{x:d.aisle,y:d.ty+2}:{x:150+ci*20,y:LANE};
  const dx=tg.x-c.x,dy=tg.y-c.y,dd=Math.hypot(dx,dy),st=SPD*1.2*dm;
  if(dd>st){c.x+=dx/dd*st;c.y+=dy/dd*st;c.f+=dm*7;c.dir=dx>0?1:-1;c.cl=0}
  else{c.x=tg.x;c.y=tg.y;if(d){c.cl+=dm*(c.s.trait==='tidy'?2:1);if(c.cl>=1.2){cleanTable(d.tx,d.ty,true);c.cl=0}}}});
 for(let i=SPARK.length-1;i>=0;i--){SPARK[i].t-=dm/3;if(SPARK[i].t<=0)SPARK.splice(i,1)}
}

/* ================================================================
   主迴圈
================================================================ */
let lastTs=0,lastUI=0;
let ERRN=0,ERRSEEN=false,LASTFRAME=0,RAFID=0;
function softErr(where,err){ERRN++;try{console.error('['+where+']',err)}catch(e){}
 if(!ERRSEEN){ERRSEEN=true;toast('⚠️ 遇到小狀況，已自動修復，可以繼續玩')}
 if(ERRN>40){ERRN=0;try{const sv=S.phase;resetScene();if(cv)cx=cv.getContext('2d');if(sv==='open')pushFeed('🔧 畫面已重新整理')}catch(e){}}}
function guard(where,fn){try{fn()}catch(err){softErr(where,err)}}
function frame(ts){
 LASTFRAME=performance.now();
 try{
  const dt=Math.min(120,ts-(lastTs||ts));lastTs=ts;
  const modalOpen=document.getElementById('modal').innerHTML||document.getElementById('vn').innerHTML;
  if(S.phase==='open'&&!S.paused&&!modalOpen){
   const dm=dt/MSM*S.speed;S.acc+=dm;let n=0;
   while(S.acc>=1&&S.t<1080&&n<40){S.acc-=1;n++;try{simMinute(false)}catch(err){S.t++;softErr('sim',err)}}
   if(n>=40)S.acc=0;
   guard('move',()=>moveAll(dm));
   if(S.t>=1080)guard('close',closeShop);
  }else if(S.phase!=='open')guard('move',()=>moveAll(dt/MSM));
  if(tab==='shop'){if(cv&&!cv.isConnected){cv=document.getElementById('cv');cx=cv?cv.getContext('2d'):null}guard('draw',()=>drawScene(ts));guard('bub',()=>{posBubbles();posHearts()})}
  if(S.phase==='open')guard('ev',()=>{evTick();spillTick()});
  if(ts-lastUI>200){lastUI=ts;guard('ui',renderLive)}
  if(ERRN>0&&Math.random()<.01)ERRN--;
 }catch(err){softErr('frame',err)}
 RAFID=requestAnimationFrame(frame);
}
if(typeof requestAnimationFrame!=='undefined')setInterval(()=>{if(typeof document!=='undefined'&&!document.hidden&&performance.now()-LASTFRAME>2500){cancelAnimationFrame(RAFID);RAFID=requestAnimationFrame(frame)}},2000);

function onSceneTap(ev){
 const r=cv.getBoundingClientRect(),x=(ev.clientX-r.left)/r.width*CW,y=(ev.clientY-r.top)/r.height*CH;
 if(tapSpill(x,y))return;
 const re=ENT.filter(e=>e.rid&&e.st!=='out').sort((a,b)=>Math.hypot(a.x-x,a.y-8-y)-Math.hypot(b.x-x,b.y-8-y))[0];

 const t=SEATS.filter(s=>s.dirty).sort((a,b)=>Math.hypot(a.tx-x,a.ty-y)-Math.hypot(b.tx-x,b.ty-y))[0];

function openModal(h){document.getElementById('modal').innerHTML=`<div class="modal" onclick="if(event.target===this&&!S.over&&S.phase!=='night')closeModal()"><div class="sheet">${h}</div></div>`;drawPortraits()}
function closeModal(){document.getElementById('modal').innerHTML='';if(ART)ART.run=false;sfx('click')}

/* ---------- 視覺小說對話框 ---------- */
let VN=null;
function showVN(lines,done){
 audioInit();VN={lines:lines.slice(),i:0,done,typing:false,shown:0,timer:null};vnLine();
}
function vnLine(){
 const v=VN;if(!v)return;if(v.i>=v.lines.length){document.getElementById('vn').innerHTML='';VN=null;v.done&&v.done();return}
 const [who,text]=v.lines[v.i];const isMe=who==='me',isSys=who==='sys';
 const nm=isSys?'':isMe?'店長（你）':REGS[who].n;
 document.getElementById('vn').innerHTML=`<div class="vn" onclick="vnNext()"><div class="box">${isSys||isMe?`<div style="width:72px;height:72px;border:2px solid var(--ink);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:34px;background:#f6e8c8;flex:none">${isSys?'💗':'☕'}</div>`:`<canvas class="por" data-id="${who}"></canvas>`}
 <div class="grow"><div class="who">${nm}</div><div class="txt" id="vntxt"></div><div class="nx">點一下繼續 ▶</div></div></div></div>`;
 drawPortraits();
 v.typing=true;v.shown=0;clearInterval(v.timer);const el=document.getElementById('vntxt');
 v.timer=setInterval(()=>{v.shown++;el.textContent=text.slice(0,v.shown);if(v.shown%2===0&&!isSys)sfx('blip',1);if(v.shown>=text.length){clearInterval(v.timer);v.typing=false}},32);
}
function vnNext(){const v=VN;if(!v)return;const text=v.lines[v.i][1];
 if(v.typing){clearInterval(v.timer);v.typing=false;document.getElementById('vntxt').textContent=text;return}
 v.i++;sfx('click');vnLine()}
function replay(id,l){showVN(REGS[id].story[l]||[])}

/* ---------- 熟客互動 ---------- */
function regDlg(id){
 const r=REGS[id],e=ENT.find(x=>x.rid===id&&x.st!=='out');if(!e){toast(`${r.n} 已經離開了`);return}
 const l=regLv(id),fav=r.fav.find(unlocked)||r.alt.find(unlocked);
 openModal(`<div class="row" style="gap:12px;align-items:flex-start"><canvas class="por" data-id="${id}"></canvas><div class="grow">
  <div class="name" style="font-size:18px">${r.n} <span class="tag">${r.job}</span></div><div class="hearts">${hearts(id)} <span class="tag p">Lv${l} ${LVN[l]}</span></div>
  <div class="tip love" style="margin-top:8px">「${greetLine(id)}」</div></div></div>
  <div class="row" style="margin-top:12px;gap:8px">
   <button class="btn big" ${e.talked?'disabled':''} onclick="regTalk('${id}')">💬 聊天${e.talked?'（已聊過）':''}</button>
   <button class="btn big pink" ${e.treated||!fav||!hasStock(fav)?'disabled':''} onclick="regTreat('${id}')">🎁 招待一杯${fav?MENU[fav].n:''}</button></div>
  <div class="hint" style="margin-top:6px">聊天 +2 好感；招待 +6 好感（會用掉一杯的原料）。每次來訪各一次。</div>
  <button class="btn big dark" style="margin-top:10px" onclick="closeModal()">回到店裡</button>`);
}
function regTalk(id){const e=ENT.find(x=>x.rid===id&&x.st!=='out');if(!e||e.talked)return;e.talked=1;S.today.talks=(S.today.talks||0)+1;
 closeModal();addAff(id,2);sfx('love',1);showVN([[id,pickA(REGS[id].talk.concat(REGX[id].talk))],['sys',`💗 ${REGS[id].n} 好感度 +2`]],()=>render())}
function regTreat(id){const e=ENT.find(x=>x.rid===id&&x.st!=='out'),r=REGS[id];if(!e||e.treated)return;
 const fav=r.fav.find(unlocked)||r.alt.find(unlocked);if(!fav||!hasStock(fav))return;
 for(const i in MENU[fav].need)consume(i,MENU[fav].need[i]);e.treated=1;S.today.talks=(S.today.talks||0)+1;
 closeModal();addAff(id,6);sfx('love',1);showVN([[id,`（收下${MENU[fav].n}）${pickA(REGX[id].treat)}`],['sys',`💗 ${r.n} 好感度 +6`]],()=>render())}

/* ================================================================
   操作
================================================================ */
function go(t){tab=t;sfx('click');render();window.scrollTo(0,0)}
function setSpeed(s){S.speed=s;S.paused=false;sfx('click');render()}
function togglePause(){S.paused=!S.paused;sfx('click');render()}
function cart(k,d){S.cart[k]=Math.max(0,(S.cart[k]||0)+d);sfx('click');render()}
function autoFill(){const e=estimate();
 for(const k in ING){if(!ingUnlocked(k))continue;const need=e.ing[k]*1.15-stock(k);S.cart[k]=need>0?Math.ceil(need/ING[k].pack):0}
 render();toast('已依今日預測填入')}
function checkout(){
 const em=S.phase==='open',mult=em?1.5:1;let total=0;for(const k in S.cart)total+=S.cart[k]*mktPrice(k)*mult;
 if(total<=0)return;if(total>S.money+300){toast('現金不足（最多可透支 $300）');return}
 for(const k in S.cart){const n=S.cart[k];if(!n)continue;const q=n*ING[k].pack,c=mktPrice(k)*mult/ING[k].pack;
  if(em)S.pending.push({k,q,c,at:S.t+30});else addLot(k,q,c)}
 S.money-=total;S.today.spend+=total;if(em)S.today.emerg+=total;S.cart={};sfx('cash',1);save();render();toast(em?'已下單，30 分鐘後到貨':'進貨完成')}
function adjP(k,d){S.price[k]=Math.max(0.5,Math.round((S.price[k]+d)*10)/10);save();render()}
function setP(k,v){S.price[k]=v;save();render()}
function buyUpg(id){const u=UPG.find(x=>x.id===id),L=lv(id);if(L>=u.lv.length)return;const c=u.lv[L].c;if(S.money<c)return;
 S.money-=c;S.today.mkt+=c;S.lv[id]=L+1;if(id==='seats'||id==='expand')buildSeats();sfx('level',1);save();render();toast(`✨ ${u.n} 升級完成`)}
function mkt(){if(S.money<150)return;S.money-=150;S.today.mkt+=150;addMod('traffic',1.3,2,'社群廣告');save();render();toast('📣 廣告上線，來客 +30%')}
function hireCand(id){const c=(S.cands||[]).find(x=>x.id===id);if(!c)return;
 if(S.staff.length>=rosterCap()){toast('員工名冊已滿，蓋員工休息室可以多請人');return}
 const want=c.role==='floor'?'floor':'bar';c.pos=posUsed(want)<slotCap(want)?want:'rest';
 S.staff.push(c);S.cands=S.cands.filter(x=>x!==c);resetCleaners();sfx('level',1);save();render();toast(c.pos==='rest'?`👋 ${c.n} 加入團隊！崗位已滿，先待在休息室（照領薪水）`:`👋 ${c.n} 加入團隊！`)}
function fire(id){const s=S.staff.find(x=>x.id===id);S.staff=S.staff.filter(x=>x.id!==id);resetCleaners();save();render();if(s)toast(`${s.n} 離開了團隊`)}
function toggleLeave(id){const s=S.staff.find(x=>x.id===id);if(!s||S.phase!=='prep')return;s.leave=!s.leave;resetCleaners();save();render()}
function postJob(){if(S.money<60)return;S.money-=60;S.today.mkt+=60;refreshCands();save();render();toast('📋 新的應徵者來了')}
function research(k){const r=RECIPES[k];if(S.lab||S.money<r.cost||!r.req())return;S.money-=r.cost;S.today.mkt+=r.cost;S.lab={k,left:r.days};sfx('click',1);save();render();toast(`🧪 開始研發「${r.n}」，${r.days} 天後完成`)}
function buyTheme(id){const t=THEMES.find(x=>x.id===id);if(S.themes.includes(id)||S.money<t.c)return;S.money-=t.c;S.today.mkt+=t.c;S.themes.push(id);S.theme=id;sfx('level',1);save();render();toast(`🎨 換上「${t.n}」`)}
function useTheme(id){if(!S.themes.includes(id))return;S.theme=id;sfx('click',1);save();render()}
function setGrade(i){if((S.maxRep||0)<GRADES[i].req)return;S.beanGrade=i;save();render()}
function openBranch(id){const b=BRANCH.find(x=>x.id===id);if(S.br[id]||S.money<b.cost||S.ch<2)return;S.money-=b.cost;S.today.mkt+=b.cost;S.br[id]=1;sfx('level',1);save();render();toast(`🎉 ${b.n} 開幕！`)}
function upBranch(id){const b=BRANCH.find(x=>x.id===id),l=S.br[id],c=Math.round(b.cost*.6*l);if(!l||l>=3||S.money<c)return;S.money-=c;S.today.mkt+=c;S.br[id]=l+1;sfx('level',1);save();render();toast(`✨ ${b.n} 升到 Lv${l+1}`)}
function takeLoan(i){const l=LOANS[i];if(S.loan||(l.req&&!l.req()))return;S.money+=l.amt;S.loan={left:l.days,pay:l.pay};sfx('cash',1);save();render();toast(`🏦 借款 ${fm(l.amt)} 已入帳`)}

/* ---------- 拉花小遊戲 ---------- */
function artGame(mode){
 if(mode==='contest'&&(S.today.contestDone||!S.today.contest))return;
 audioInit();const w=tcount('art')?.04:0;
 ART={mode,round:0,scores:[],pos:0,dir:1,run:true,last:0,speeds:[0.9,1.3,1.8],zones:[.2+w,.15+w,.11+w]};
 openModal(`<div class="kicker">${mode==='contest'?'🏆 季節拉花大賽':'☕ 拉花練習'}</div><h2 class="px" style="margin:4px 0 0;font-weight:400">指針到正中間時倒奶！</h2>
 <div class="art"><canvas id="artCup" width="64" height="64" style="width:180px;height:180px"></canvas>
 <canvas id="artBar" width="120" height="10" style="width:100%;height:34px"></canvas>
 <div id="artInfo" class="px" style="font-size:16px">第 1 / 3 杯</div>
 <button class="btn big gold" id="artBtn" onclick="artTap()">倒！🥛</button></div>
 <div class="hint">綠色最準、黃色還行。三杯平均 85 分以上金獎、70 分銀獎、50 分銅獎。${tcount('art')?'拉花達人在班，判定範圍變寬。':''}</div>`);
 drawCup();requestAnimationFrame(artLoop);
}
function artLoop(ts){if(!ART||!ART.run)return;const c=document.getElementById('artBar');if(!c){ART.run=false;return}
 const dt=ART.last?Math.min(50,ts-ART.last):16;ART.last=ts;
 ART.pos+=ART.dir*ART.speeds[ART.round]*dt/1000;if(ART.pos>1){ART.pos=1;ART.dir=-1}if(ART.pos<0){ART.pos=0;ART.dir=1}
 const g=c.getContext('2d'),z=ART.zones[ART.round];
 g.fillStyle='#e2d5be';g.fillRect(0,0,120,10);g.fillStyle='#E0A43A';g.fillRect(Math.round(60-z*60),0,Math.round(z*120),10);
 g.fillStyle='#5E8A45';g.fillRect(Math.round(60-z*20),0,Math.round(z*40),10);
 g.fillStyle='#2b2622';g.fillRect(Math.round(ART.pos*118),0,2,10);
 requestAnimationFrame(artLoop)}
function artTap(){if(!ART||!ART.run||ART.round>=3)return;
 const hz=ART.zones[ART.round]/2,d=Math.abs(ART.pos-.5),sc=Math.round(clamp(100*(1-Math.max(0,d-hz*.33)/(hz*1.7)),0,100));
 ART.scores.push(sc);sfx(sc>=85?'spark':sc>=50?'clink':'sad',1);ART.round++;drawCup();
 const info=document.getElementById('artInfo');
 if(ART.round<3){info.textContent=`第 ${ART.round} 杯：${sc} 分　→　第 ${ART.round+1} / 3 杯`;ART.pos=R()<.5?0:1;ART.dir=ART.pos?-1:1;return}
 ART.run=false;const avg=Math.round(ART.scores.reduce((a,b)=>a+b,0)/3);S.artBest=Math.max(S.artBest||0,avg);
 let medal='',txt='';
 if(ART.mode==='contest'){S.today.contestDone=true;
  if(avg>=85){medal='🥇';S.medals.gold++;S.money+=800;passPts(120);ownXp(300);S.rep=clamp(S.rep+5,0,100);txt='金獎！獎金 $800、口碑 +5'}
  else if(avg>=70){medal='🥈';S.medals.silver++;S.money+=400;passPts(80);ownXp(200);S.rep=clamp(S.rep+3,0,100);txt='銀獎！獎金 $400、口碑 +3'}
  else if(avg>=50){medal='🥉';S.medals.bronze++;S.money+=150;passPts(50);ownXp(100);S.rep=clamp(S.rep+1,0,100);txt='銅獎！獎金 $150、口碑 +1'}
  else{medal='🙇';txt='這次沒有得獎，下一季再來！'}
  S.today.medal=`🏆 拉花大賽 ${medal} ${txt}（${avg} 分）`;sfx(avg>=50?'level':'sad',1);save()}
 else{medal=avg>=85?'🥇':avg>=70?'🥈':avg>=50?'🥉':'☕';txt='練習結果（不計獎）'}
 info.innerHTML=`三杯：${ART.scores.join('、')}　平均 <b>${avg}</b> 分`;
 const btn=document.getElementById('artBtn');btn.outerHTML=`<div class="medal">${medal}</div><div style="text-align:center">${txt}</div><button class="btn big dark" onclick="closeModal();render()">完成</button>`;
}
function drawCup(){const c=document.getElementById('artCup');if(!c)return;const g=c.getContext('2d'),F=(x,y,w,h,col)=>{g.fillStyle=col;g.fillRect(x,y,w,h)};
 F(0,0,64,64,'#f6e8c8');
 for(let y=0;y<64;y++)for(let x=0;x<64;x++){const d=Math.hypot(x-32,y-32);if(d<30)F(x,y,1,1,d>27?'#ffffff':d>25?'#d8d0c4':d>22?'#a8703f':'#6a4630')}
 const disk=(cx,cy,r,col)=>{for(let y=-r;y<=r;y++)for(let x=-r;x<=r;x++)if(x*x+y*y<=r*r)F(Math.round(cx+x),Math.round(cy+y),1,1,col)};
 ART&&ART.scores.forEach((sc,i)=>{const j=(100-sc)/100*6,jx=(R()-.5)*j*2,jy=(R()-.5)*j,col='#f6ecd8';
  if(i===0){disk(27+jx,30+jy,6,col);disk(37+jx,30+jy,6,col);for(let r=0;r<11;r++)F(Math.round(22+jx+r*.5),Math.round(33+jy+r),Math.max(1,Math.round(20-r)),1,col)}
  if(i===1){disk(32+jx,19+jy,4,col);disk(32+jx,24+jy,3,'#a8703f');disk(32+jx,24+jy,2,col)}
  if(i===2){for(let y=12;y<46;y++)F(Math.round(32+jx*(y-12)/34),y,1,1,'#a8703f')}});
}

function renameDlg(){openModal(`<div class="kicker">店名</div><input class="nm" id="nm" maxlength="12" value="${S.name}" style="margin-top:8px"><button class="btn big dark" style="margin-top:12px" onclick="S.name=document.getElementById('nm').value.trim()||S.name;save();closeModal();render()">儲存</button>`)}
function restartDlg(){openModal(`<h2 class="px" style="margin:0 0 6px;font-weight:400">開一間新的店？</h2><p class="sub">目前進度會被清除。</p><input class="nm" id="nm2" maxlength="12" placeholder="店名（例：巷口咖啡）"><div class="row" style="margin-top:12px"><button class="btn big" onclick="closeModal()" ${S.over?'disabled':''}>取消</button><button class="btn big dark" onclick="newGame(document.getElementById('nm2').value.trim());closeModal();tab='shop';render();showVN(PROLOGUE,showIntro)">開店</button></div>`)}
function showIntro(){openModal(`<div class="kicker">玩法說明</div><h2 class="px" style="margin:4px 0 8px;font-weight:400">開一間小咖啡店，一天一天來。</h2>
 <div class="tip">📦 <b>早上進貨</b>：看天氣、星期和預估來客決定進多少。鮮奶放 4 天，可頌和冰塊只能放當天。</div>
 <div class="tip">☕ <b>營業</b>：客人進門排隊，走到櫃檯點餐、付款，在取餐台等飲料做好，再入座或外帶。排太久會走人。</div>
 <div class="tip">🏷️ <b>定價</b>：上班族要快、學生在意價格、遊客願意多付，每個品項都有接受度與建議價。</div>
 <div class="tip">🪑 <b>座位</b>：內用客人離開後留下髒桌，點一下清理，或雇外場人員。</div>
 <div class="tip">🔥 <b>營業中的互動</b>：尖峰用「全力衝刺」加快出杯，客人排隊時「招呼」讓大家多等一下；記得收小費罐、點愛心、處理突發事件。速度最快可以到 16×。</div>
 <div class="tip">🐱 <b>店貓</b>：在「經營 › 店貓」領養，或收留門口的流浪貓。每天摸摸牠們能提升親密度。</div>
 <div class="tip love">💗 <b>熟客</b>：6 位熟客各有最愛的飲品和來店時段。提高好感度可以解鎖劇情和經營加成。</div>
 <div class="tip">🍂 <b>四季</b>：每季 14 天，季節限定飲品自動換口味，有節慶與每季的拉花大賽。每過一年房租會調漲。</div>
 <div class="tip">👥 <b>員工與研發</b>：在「經營」雇用有特質的員工、研發新配方；「進貨」可換更高級的咖啡豆。</div>
 <div class="tip">👑 <b>品牌</b>：跟著主線六章前進，開分店、拿拉花冠軍，成為巷口傳說。右上角可開關 🎵 音樂與 🔊 音效。</div>
 <button class="btn big dark" style="margin-top:12px" onclick="closeModal()">開始經營</button>`)}

/* ================================================================
   啟動
================================================================ */
if(typeof document!=='undefined'&&document.getElementById('app')&&document.getElementById('app').isConnected!==undefined){
 if(load()&&S.today&&S.today.regPlan){normalize();resetScene();if(S.phase==='open')S.paused=true;render();if(S.phase==='night')showSummary()}
 else{newGame();render();showVN(PROLOGUE,showIntro)}
 requestAnimationFrame(frame);
}else{newGame()}
</script>
